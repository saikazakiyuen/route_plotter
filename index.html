<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任意間隔ルートプロッター（経由地注記付き）</title>
    <!-- Turf.js (空間計算用ライブラリ) -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; }
        #controls { margin-bottom: 10px; padding: 15px; background: #f4f4f4; border-radius: 5px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input[type="text"], textarea { padding: 5px; width: 220px; font-size: 14px; }
        textarea { height: 60px; resize: vertical; }
        button { padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 3px; font-weight: bold; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        #click-mode { background: #e9ecef; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        #map { flex-grow: 1; width: 100%; border: 1px solid #ccc; min-height: 300px; }
        #result-box { height: 150px; overflow-y: scroll; background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="controls">
        <div class="input-group">
            <label>出発地 (地名 or 緯度,経度):</label>
            <input type="text" id="origin" placeholder="例: 35.6812, 139.7671">
        </div>
        
        <div class="input-group">
            <label>経由地 (改行で複数指定可):</label>
            <textarea id="waypoints" placeholder="この道路を通したい場合、その上の地点を指定"></textarea>
        </div>

        <div class="input-group">
            <label>目的地 (地名 or 緯度,経度):</label>
            <input type="text" id="destination" placeholder="例: 皇居">
        </div>

        <div class="input-group">
            <label>移動手段:</label>
            <select id="travel-mode" style="padding: 5px;">
                <option value="WALKING">徒歩</option>
                <option value="DRIVING">自動車</option>
                <option value="BICYCLING">自転車</option>
            </select>
        </div>

        <!-- プロット間隔の指定UIを追加 -->
        <div class="input-group">
            <label>プロット間隔:</label>
            <div style="display: flex; gap: 5px; align-items: center;">
                <select id="interval-select" style="padding: 5px;" onchange="toggleCustomInterval()">
                    <option value="50">50mおき</option>
                    <option value="100">100mおき</option>
                    <option value="200">200mおき</option>
                    <option value="custom">任意指定</option>
                </select>
                <input type="number" id="custom-interval" value="30" style="display: none; width: 70px;" placeholder="単位(m)">
            </div>
        </div>

        <div id="click-mode" class="input-group">
            <strong>📍地図クリックで入力:</strong>
            <label><input type="radio" name="click-target" value="origin" checked> 出発地にセット</label>
            <label><input type="radio" name="click-target" value="waypoints"> 経由地に追加</label>
            <label><input type="radio" name="click-target" value="destination"> 目的地にセット</label>
        </div>

        <div class="input-group" style="justify-content: flex-end; flex-direction: row; align-items: flex-end; gap: 10px;">
            <button onclick="calculateAndPlotRoute()">ルート計算＆プロット</button>
            <button id="download-btn" class="btn-success" onclick="downloadTxt()" disabled>TXTで保存</button>
        </div>
    </div>

    <div id="map"></div>
    
    <div id="result-box">
        ここに指定間隔ごとの緯度経度が出力されます...<br>
    </div>

    <script>
        let map;
        let directionsService;
        let directionsRenderer;
        let markers = [];
        let calculatedCoords = []; 

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 34.690, lng: 135.195 },
                zoom: 13,
            });
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: true
            });

            map.addListener("click", (e) => {
                const latLngStr = `${e.latLng.lat().toFixed(6)}, ${e.latLng.lng().toFixed(6)}`;
                const target = document.querySelector('input[name="click-target"]:checked').value;
                
                if (target === "origin") {
                    document.getElementById("origin").value = latLngStr;
                } else if (target === "destination") {
                    document.getElementById("destination").value = latLngStr;
                } else if (target === "waypoints") {
                    const wpElem = document.getElementById("waypoints");
                    if (wpElem.value === "") {
                        wpElem.value = latLngStr;
                    } else {
                        wpElem.value += "\n" + latLngStr;
                    }
                }
            });
        }

        function toggleCustomInterval() {
            const select = document.getElementById("interval-select");
            const customInput = document.getElementById("custom-interval");
            if (select.value === "custom") {
                customInput.style.display = "block";
            } else {
                customInput.style.display = "none";
            }
        }

        function getIntervalValue() {
            const select = document.getElementById("interval-select").value;
            if (select === "custom") {
                return parseFloat(document.getElementById("custom-interval").value);
            }
            return parseFloat(select);
        }

        function calculateAndPlotRoute() {
            const origin = document.getElementById("origin").value;
            const destination = document.getElementById("destination").value;
            const waypointsText = document.getElementById("waypoints").value;
            const travelMode = document.getElementById("travel-mode").value;
            const resultBox = document.getElementById("result-box");
            const downloadBtn = document.getElementById("download-btn");
            const interval = getIntervalValue();

            if (!origin || !destination) {
                alert("出発地と目的地を入力してください。");
                return;
            }
            if (!interval || interval <= 0) {
                alert("正しいプロット間隔を入力してください。");
                return;
            }

            const waypoints = [];
            if (waypointsText.trim() !== "") {
                const lines = waypointsText.split("\n");
                lines.forEach(line => {
                    if (line.trim() !== "") {
                        waypoints.push({ location: line.trim(), stopover: true });
                    }
                });
            }

            resultBox.innerHTML = "計算中...<br>";
            clearMarkers();
            calculatedCoords = []; 
            downloadBtn.disabled = true; 

            const request = {
                origin: origin,
                destination: destination,
                waypoints: waypoints,
                travelMode: google.maps.TravelMode[travelMode]
            };

            directionsService.route(request, (response, status) => {
                if (status === "OK") {
                    directionsRenderer.setDirections(response);
                    
                    const route = response.routes[0];
                    let accumulatedCoords = [];
                    const keyPoints = []; // 始点・経由地・終点を保持する配列

                    // [始点] を追加
                    const startLoc = route.legs[0].start_location;
                    keyPoints.push({
                        dist: 0,
                        lat: startLoc.lat(),
                        lng: startLoc.lng(),
                        label: '※始点'
                    });

                    // 各区間（Leg）の処理
                    route.legs.forEach((leg, index) => {
                        leg.steps.forEach(step => {
                            step.path.forEach(latLng => {
                                accumulatedCoords.push([latLng.lng(), latLng.lat()]);
                            });
                        });

                        // ここまでのルートの距離を計算（経由地・終点の距離位置を特定するため）
                        const lineUpToHere = turf.lineString(accumulatedCoords);
                        const distUpToHere = turf.length(lineUpToHere, {units: 'meters'});
                        
                        // ラベルの設定（最後なら終点、それ以外は経由地）
                        const labelText = (index === route.legs.length - 1) ? '※終点' : `※経由地${index + 1}`;
                        const endLoc = leg.end_location;
                        
                        keyPoints.push({
                            dist: distUpToHere,
                            lat: endLoc.lat(),
                            lng: endLoc.lng(),
                            label: labelText
                        });
                    });

                    // 全体のルート線をTurf.js用に生成
                    const fullLine = turf.lineString(accumulatedCoords);
                    const totalDistance = turf.length(fullLine, {units: 'meters'});
                    let outputPoints = [];

                    // 【1】重要なポイント（始点・経由地・終点）を出力配列に追加
                    keyPoints.forEach(kp => outputPoints.push(kp));

                    // 【2】指定間隔（50m等）のポイントを出力配列に追加
                    for (let d = interval; d < totalDistance; d += interval) {
                        // 重要なポイントと位置が完全に被った場合は重複を避ける
                        const isDuplicate = keyPoints.some(kp => Math.abs(kp.dist - d) < 0.1);
                        if (!isDuplicate) {
                            const point = turf.along(fullLine, d, {units: 'meters'});
                            outputPoints.push({
                                dist: d,
                                lat: point.geometry.coordinates[1],
                                lng: point.geometry.coordinates[0],
                                label: ''
                            });
                        }
                    }

                    // 【3】距離順（ルート順）に並び替える
                    outputPoints.sort((a, b) => a.dist - b.dist);

                    // 描画とデータ出力
                    let outputHtml = `総距離: ${Math.round(totalDistance)} メートル\n\n`;

                    outputPoints.forEach(pt => {
                        const latStr = pt.lat.toFixed(6);
                        const lngStr = pt.lng.toFixed(6);
                        // ラベルがある場合はスペースを空けて追加
                        const labelStr = pt.label ? ` ${pt.label}` : ''; 
                        
                        // 画面表示用
                        outputHtml += `${Math.round(pt.dist)}m地点: ${latStr}, ${lngStr}${labelStr}\n`;
                        
                        // ダウンロード用（ご指定のフォーマット）
                        calculatedCoords.push(`${latStr}, ${lngStr}${labelStr}`);

                        // マーカーの設定（ラベル付きの重要な点は青色で大きく、等間隔の点は赤色で小さく）
                        const iconColor = pt.label ? "#0000FF" : "#FF0000";
                        const iconScale = pt.label ? 6 : 4;
                        const zIndex = pt.label ? 100 : 1; // 重要な点が手前に来るように

                        const marker = new google.maps.Marker({
                            position: { lat: pt.lat, lng: pt.lng },
                            map: map,
                            title: pt.label ? pt.label : `${Math.round(pt.dist)}m地点`,
                            zIndex: zIndex,
                            icon: { path: google.maps.SymbolPath.CIRCLE, scale: iconScale, fillColor: iconColor, fillOpacity: 1, strokeWeight: 1, strokeColor: "#FFF" }
                        });
                        markers.push(marker);
                    });

                    resultBox.textContent = outputHtml;
                    downloadBtn.disabled = false;

                } else {
                    window.alert("ルートの取得に失敗しました: " + status);
                }
            });
        }

        function downloadTxt() {
            if (calculatedCoords.length === 0) return;
            const textContent = calculatedCoords.join("\n");
            const blob = new Blob([textContent], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "route_coordinates.txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function clearMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }
    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBKUH6Z-ygwUY5MaBC0ukNpwgiEQWQjkXY
&callback=initMap"></script>
</body>
</html>
